services:
  - type: web
    name: store-bi
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: store-bi-db
          property: connectionString
      - key: STORE_BI_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://store-bi.onrender.com
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://store-bi.onrender.com/auth/google/callback
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

databases:
  - name: store-bi-db
    databaseName: storebi
    user: storebi
    region: singapore
    plan: basic-256mb
